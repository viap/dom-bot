name: Deployment
on:
  pull_request:
    branches:
      - master
      - develop
  push:
    branches:
      - master
    paths-ignore:
      - '.github/workflows/*'
  workflow_dispatch:

concurrency:
  group: dom-bot-prod-deploy
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:8.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand(\"ping\")'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Get the project code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Run integration tests
        run: npm run test:integration
        env:
          DOM_BOT_TEST_MONGO_URL: mongodb://127.0.0.1:27017
          DOM_BOT_TEST_MONGO_DB_NAME: domBotTest

      - name: Typecheck tests
        run: npm run typecheck:test

      - name: Run linting
        run: npm run lint

  deploy:
    runs-on: ubuntu-latest
    environment: prod
    needs: test
    steps:
      - name: Get the project code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Make env file with secrets
        uses: SpicyPizza/create-envfile@v2.0
        with:
          directory: 'config/'
          fail_on_empty: true
          envkey_NODE_ENV: prod
          envkey_TOKEN: ${{secrets.TOKEN}}
          envkey_POLING_DELAY: ${{secrets.POLING_DELAY}}
          envkey_MONGO_DB_URL: ${{secrets.MONGO_DB_URL}}
          envkey_MONGO_DB_NAME: ${{secrets.MONGO_DB_NAME}}
          envkey_MONGO_DB_USER: ${{secrets.MONGO_DB_USER}}
          envkey_MONGO_DB_PASSWORD: ${{secrets.MONGO_DB_PASSWORD}}
          envkey_API_URL: ${{secrets.API_URL}}
          envkey_API_WEBSOCKET_URL: ${{secrets.API_WEBSOCKET_URL}}
          envkey_API_CLIENT_NAME: ${{secrets.API_CLIENT_NAME}}
          envkey_API_CLIENT_PASSWORD: ${{secrets.API_CLIENT_PASSWORD}}

      - name: Install dependencies
        run: npm ci

      - name: Build the project
        run: npm run build

      - name: Deploy to server
        uses: easingthemes/ssh-deploy@v6.0.1
        with:
          SSH_PRIVATE_KEY: ${{secrets.SSH_PRIVATE_KEY}}
          ARGS: '-avzr --delete'
          REMOTE_HOST: ${{secrets.REMOTE_HOST}}
          REMOTE_USER: ${{secrets.REMOTE_USER}}
          TARGET: ${{secrets.REMOTE_TARGET}}
          EXCLUDE: '/.github/, /.git/, /.gitignore, /src/, /node_modules/, /test/, /coverage/'
          SCRIPT_BEFORE: |
            [ -n "${{secrets.REMOTE_TARGET}}" ] || { echo "REMOTE_TARGET secret is missing"; exit 1; }
            mkdir -p ${{secrets.REMOTE_TARGET}}
            echo "Creating backup of current deployment..."
            if [ -d "${{secrets.REMOTE_TARGET}}" ] && [ "$(ls -A ${{secrets.REMOTE_TARGET}})" ]; then
              BACKUP_DIR="${{secrets.REMOTE_TARGET}}_backup_$(date +%Y%m%d_%H%M%S)"
              cp -r ${{secrets.REMOTE_TARGET}} $BACKUP_DIR
              echo "Backup created at: $BACKUP_DIR"
              # Keep only the last 5 backups
              ls -dt ${{secrets.REMOTE_TARGET}}_backup_* 2>/dev/null | tail -n +6 | xargs -r rm -rf
            else
              echo "No existing deployment found, skipping backup"
            fi

      - name: Remote | Init and start the project
        uses: fifsky/ssh-action@v0.0.6
        with:
          command: |
            export TOKEN="${{secrets.TOKEN}}"
            export POLING_DELAY="${{secrets.POLING_DELAY}}"
            export MONGO_DB_URL="${{secrets.MONGO_DB_URL}}"
            export MONGO_DB_NAME="${{secrets.MONGO_DB_NAME}}"
            export MONGO_DB_USER="${{secrets.MONGO_DB_USER}}"
            export MONGO_DB_PASSWORD="${{secrets.MONGO_DB_PASSWORD}}"
            export API_URL="${{secrets.API_URL}}"
            export API_WEBSOCKET_URL="${{secrets.API_WEBSOCKET_URL}}"
            export API_CLIENT_NAME="${{secrets.API_CLIENT_NAME}}"
            export API_CLIENT_PASSWORD="${{secrets.API_CLIENT_PASSWORD}}"
            export REMOTE_TARGET="${{secrets.REMOTE_TARGET}}"
            export NODE_BIN_DIR="$(dirname "$(command -v node)")"
            cd "${REMOTE_TARGET}"
            bash scripts/deploy/post_sync_start.sh
          host: ${{secrets.REMOTE_HOST}}
          user: ${{secrets.REMOTE_USER}}
          key: ${{secrets.SSH_PRIVATE_KEY}}

      - name: Notify deployment success
        if: success()
        run: |
          echo "✅ Deployment successful!"
          echo "Branch: ${{ github.ref_name }}"
          echo "Commit: ${{ github.sha }}"
          echo "Deployed at: $(date)"
          echo "Environment: production"

      - name: Notify deployment failure
        if: failure()
        run: |
          echo "❌ Deployment failed!"
          echo "Branch: ${{ github.ref_name }}"
          echo "Commit: ${{ github.sha }}"
          echo "Failed at: $(date)"
          echo "Please check logs and consider rollback if necessary"

      - name: Create deployment summary
        if: always()
        run: |
          echo "# 🚀 Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Repository:** ${{ github.repository }}" >> $GITHUB_STEP_SUMMARY
          echo "**Branch:** ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "**Workflow:** ${{ github.workflow }}" >> $GITHUB_STEP_SUMMARY
          echo "**Status:** ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
          echo "**Triggered by:** ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${{ job.status }}" == "success" ]; then
            echo "✅ **Deployment completed successfully**" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "**Next steps:**" >> $GITHUB_STEP_SUMMARY
            echo "- Monitor application logs for any issues" >> $GITHUB_STEP_SUMMARY
            echo "- Verify bot functionality manually if needed" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **Deployment failed**" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "**Troubleshooting steps:**" >> $GITHUB_STEP_SUMMARY
            echo "1. Review the workflow logs above for error details" >> $GITHUB_STEP_SUMMARY
            echo "2. Check server logs via SSH if needed" >> $GITHUB_STEP_SUMMARY
            echo "3. Consider running a manual rollback if necessary" >> $GITHUB_STEP_SUMMARY
          fi

  rollback:
    runs-on: ubuntu-latest
    environment: prod
    if: ${{ always() && needs.deploy.result == 'failure' }}
    needs: deploy
    steps:
      - name: Rollback to previous deployment
        uses: fifsky/ssh-action@v0.0.6
        with:
          command: |
            export REMOTE_TARGET="${{secrets.REMOTE_TARGET}}"
            bash "${REMOTE_TARGET}/scripts/deploy/rollback.sh"
          host: ${{secrets.REMOTE_HOST}}
          user: ${{secrets.REMOTE_USER}}
          key: ${{secrets.SSH_PRIVATE_KEY}}
